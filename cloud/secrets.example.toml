# Copy these fields into Streamlit Community Cloud's private Secrets settings.
# Never commit real secrets or transfer the local account database.
[cloud]
workspace_id = "invoice-recovery-demo"
# Use Supabase Connect -> Session pooler (IPv4, port 5432).
database_url = "postgresql://APP_ROLE:PRIVATE_PASSWORD@YOUR_SESSION_POOLER_HOST:5432/postgres"
root_cert_pem = """-----BEGIN CERTIFICATE-----
PASTE_THE_PUBLIC_SUPABASE_SERVER_ROOT_CERTIFICATE
-----END CERTIFICATE-----"""

[groq]
api_key = "SET_PRIVATELY_IN_STREAMLIT_SECRETS"
model = "llama-3.3-70b-versatile"

# Required only while the seeded Cloud account store is empty. This is private
# server configuration, never public registration. Remove after first setup.
[cloud.owner]
username = "choose-an-owner"
display_name = "Cloud workspace owner"
password = "REPLACE_WITH_A_UNIQUE_PRIVATE_PASSPHRASE"
