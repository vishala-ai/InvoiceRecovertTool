[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supplier-recovery-starter"
version = "0.1.0"
description = "Synthetic supplier rate discrepancy review with local and Cloud pilot workflows"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
ui = ["streamlit>=1.47,<2"]
graph = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]
ai = ["langchain-openai>=1,<2", "python-dotenv>=1,<2"]
ollama = ["pydantic>=2,<3"]
vector = ["qdrant-client>=1.16,<2"]
cloud = ["psycopg[binary]>=3.2,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
recover = "recovery.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/recovery"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
